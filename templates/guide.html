{# A how-to-play page: written by hand, in content/pages/wiki/guide/. #}
{% extends "base.html" %}
{% block main %}
    <p class="crumbs"><a href="/wiki/">Wiki</a> &gt; How to play &gt; {{ page.title }}</p>
    <article class="win">
      <div class="win-head has-x">
        <h1>{{ page.title }}</h1>
        <a class="win-x" href="/wiki/" aria-label="Close: back to the Wiki"></a>
      </div>
      <div class="win-mid">
        <div class="prose">
{{ body }}
        </div>
      </div>
      <div class="win-foot">
        <div class="split">
          <a class="btn" href="/wiki/">Wiki</a>
          <span class="dim">Written for game version {{ page.game_version }}</span>
        </div>
      </div>
    </article>
{% endblock %}
